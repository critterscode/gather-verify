<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LaneHelp Resource Export</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; max-width: 900px; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
      input { width: 100%; padding: 0.5rem; margin: 0.4rem 0 1rem; }
      button { padding: 0.7rem 1rem; font-size: 1rem; cursor: pointer; }
      .muted { color: #555; }
      .pill { display: inline-block; margin-right: .4rem; margin-bottom: .4rem; padding: .2rem .5rem; border-radius: 999px; background: #f1f1f1; }
    </style>
  </head>
  <body>
    <h1>LaneHelp: Lane County Resource CSV Export</h1>
    <div class="card">
      <p>
        Crawls <strong>multiple Lane County sources</strong> (county/city sites, nonprofits, service directories,
        and 211 as one source among many), then returns a CSV.
      </p>
      <div>
        <span class="pill">lanecounty.org</span>
        <span class="pill">eugene-or.gov</span>
        <span class="pill">springfield-or.gov</span>
        <span class="pill">211info.org</span>
        <span class="pill">whitebirdclinic.org</span>
        <span class="pill">svdp.us</span>
      </div>

      <label>Max pages to crawl</label>
      <input id="maxPages" type="number" value="1200" min="50" max="5000" />

      <label>Workers</label>
      <input id="workers" type="number" value="10" min="1" max="30" />

      <label>Config path (optional)</label>
      <input id="config" type="text" value="config/lanehelp_sources.example.json" />

      <button id="download">Download CSV</button>
      <p id="status" class="muted"></p>
    </div>

    <script>
      const button = document.getElementById('download');
      const status = document.getElementById('status');

      button.addEventListener('click', () => {
        const maxPages = encodeURIComponent(document.getElementById('maxPages').value || '1200');
        const workers = encodeURIComponent(document.getElementById('workers').value || '10');
        const config = encodeURIComponent(document.getElementById('config').value || 'config/lanehelp_sources.example.json');

        status.textContent = 'Building CSV... this can take several minutes for large crawls.';
        window.location.href = `/api/export-csv?maxPages=${maxPages}&workers=${workers}&config=${config}`;
      });
    </script>
  </body>
</html>
